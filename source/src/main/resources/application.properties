

spring.datasource.url = jdbc:mysql://localhost:3306/estateadvance
spring.datasource.username = root
spring.datasource.password = ${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto = none
#spring.jpa.hibernate.ddl-auto = create
#spring.jpa.hibernate.ddl-auto = update
#spring.jpa.hibernate.ddl-auto = create-drop

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL55Dialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans = true
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# Tắt mặc định: ghi console đồng bộ làm chậm request (bật lại khi cần đếm số SQL/request)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===== Redis cache =====
spring.cache.type=redis
spring.redis.host=localhost
spring.redis.port=6379
# Redis chết thì báo lỗi nhanh (2s) rồi chạy tiếp bằng MySQL, không treo trang
spring.redis.timeout=2000ms
spring.redis.connect-timeout=2000ms


# ===== Hiệu năng (xem kế hoạch v2, Bước 1.2) =====
# Gom lazy-load rentarea: SELECT ... FROM rentarea WHERE buildingid IN (?,?,...) => N+1 còn 2 câu
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# HikariCP: đặt tường minh để biết điểm bão hòa khi tải tăng (mặc định 10)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
